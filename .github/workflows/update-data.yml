name: Update Gold Data

on:
  schedule:
    - cron: '*/15 * * * 1-5'   # jen všední dny (o víkendu se zlato neobchoduje)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data          # dva běhy najednou se dřív praly o git push
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update data.json (+ notifikace při změně signálu)
        env:
          # Klíče jsou v Settings -> Secrets and variables -> Actions, NE v kódu.
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: python3 scripts/update_data.py

      - name: Commit data (jen při změně)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then echo "Beze změny"; exit 0; fi
          git commit -m "Auto: XAUUSD $(python3 -c "import json;d=json.load(open('data.json'));print(d.get('price','?'),d.get('signal','?'))")"
          git push
